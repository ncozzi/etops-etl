services:
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow

    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db

    volumes:
      - airflow-data:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ./etl:/opt/airflow/etl
      - ./dbt:/opt/airflow/dbt
      - ./data:/opt/airflow/data

    command:
      - bash
      - -c
      - |
        airflow db init &&
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true

    restart: "no"

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db

    volumes:
      - airflow-data:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ./etl:/opt/airflow/etl
      - ./dbt:/opt/airflow/dbt
      - ./data:/opt/airflow/data

    ports:
      - "8080:8080"

    command: webserver
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db

    volumes:
      - airflow-data:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ./etl:/opt/airflow/etl
      - ./dbt:/opt/airflow/dbt
      - ./data:/opt/airflow/data

    command: scheduler

  dashboard:
    build:
      context: ./dashboard

    volumes:
      - ./data:/app/data

    ports:
      - "8501:8501"

    depends_on:
      airflow-scheduler:
        condition: service_started

volumes:
  airflow-data: